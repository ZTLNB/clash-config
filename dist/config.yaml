profile:
  "store-selected": true
  "store-fake-ip": true
"geodata-loader": standard
"geosite-matcher": mph
"global-client-fingerprint": chrome
"global-ua": chrome
"unified-delay": true
"tcp-concurrent": true
foreign_nameservers:
  - "tls://dns.opendns.com"
domestic_nameservers:
  - "tls://223.5.5.5"
dns:
  enable: true
  ipv6: true
  "prefer-h3": false
  "use-hosts": false
  "use-system-hosts": true
  listen: "0.0.0.0:1053"
  "cache-algorithm": arc
  "enhanced-mode": "fake-ip"
  "fake-ip-range": 198.18.0.1/16
  "fake-ip-filter-mode": blacklist
  "fake-ip-filter":
    - +.lan
    - +.local
    - +.msftconnecttest.com
    - +.msftncsi.com
    - localhost.ptlogin2.qq.com
    - localhost.sec.qq.com
    - localhost.work.weixin.qq.com
    - "*.localdomain"
    - "*.example"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "*.local"
    - "*.home.arpa"
  nameserver:
    - "tls://223.5.5.5"
  "proxy-server-nameserver":
    - "tls://dns.opendns.com"
    - "tls://223.5.5.5"
  "nameserver-policy": {}
sniffer:
  enable: true
  "force-dns-mapping": true
  "parse-pure-ip": true
  "override-destination": true
  sniff:
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - "8080-8880"
      "override-destination": true
    QUIC:
      ports:
        - 443
        - 8443
